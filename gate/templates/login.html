{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="container section" style="max-width: 420px;">
  <p class="audience-tag">Drill desk</p>
  <h1>Sign in</h1>
  <form method="post" style="margin-top: 1.5rem;">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">Sign in</button>
  </form>
  <p style="margin-top: 1rem; color: var(--muted); font-size: 0.9rem;">Need a drill desk? <a href="{{ url_for('signup') }}">Open one</a></p>
  <p style="margin-top: 0.75rem; font-size: 0.85rem;"><a href="{{ url_for('operator_page') }}">Production weld →</a></p>
</div>
{% endblock %}
