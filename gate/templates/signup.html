{% extends "base.html" %}
{% block title %}Drill desk{% endblock %}
{% block content %}
<div class="container section" style="max-width: 420px;">
  <p class="audience-tag">Drills only · not the product</p>
  <h1>Drill desk</h1>
  <p style="color: var(--muted); margin: 0.5rem 0 1.5rem;">For engineers wiring integration tests. For production clearance, <a href="{{ url_for('operator_page') }}">weld a path</a>.</p>
  <form method="post">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">Open drill desk</button>
  </form>
  <p style="margin-top: 1rem; color: var(--muted); font-size: 0.9rem;">Already have a desk? <a href="{{ url_for('login') }}">Sign in</a></p>
  <p style="margin-top: 0.75rem; font-size: 0.85rem;"><a href="{{ url_for('operator_page') }}">Weld a path</a> · <a href="{{ url_for('pricing') }}">Pricing</a></p>
</div>
{% endblock %}
