<section class="container section protocol-doors" aria-label="What you can call now">
  <h2 class="protocol-heading">What you can call now</h2>
  <p class="protocol-lead">MCP, OpenAPI, the payment rail, and a CLI with an exit code. Agents use the doors. Humans open receipts. There is no chatbot.</p>
  <div class="protocol-grid">
    {% for d in protocol_doors %}
    <a class="card protocol-card" href="{{ d.href }}">
      <h3>{{ d.label }}</h3>
      <p>{{ d.plain }}</p>
    </a>
    {% endfor %}
  </div>
</section>
