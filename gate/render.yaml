services:
  - type: web
    name: gate-api
    runtime: python
    plan: starter
    rootDir: gate
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from public_url import assert_prod_public; assert_prod_public()" && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    disk:
      name: gate-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: GATE_DB_PATH
        value: /var/data/gate.db
      - key: GATE_NOTIFY_WEBHOOK
        sync: false
      - key: GATE_OPS_TOKEN
        sync: false
      - key: VELARU_API_URL
        value: https://velaru.onrender.com
      - key: GATE_DEV_MODE
        value: "0"
      - key: GATE_SECRET_KEY
        sync: false
      - key: GATE_PUBLIC_URL
        sync: false
      - key: GATE_OCSP_TIMEOUT
        value: "5"
      - key: GATE_ALLOW_LOCAL
        value: "0"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_INSTALL_PRICE_ID
        sync: false
      - key: STRIPE_BIND_ROOM_PRICE_ID
        sync: false
      - key: STRIPE_WELD_PRICE_ID
        sync: false
      - key: STRIPE_FLOOR_PRICE_ID
        sync: false
      - key: GATE_BIND_ROOM_PRICE_LABEL
        value: "$1,750"
      - key: GATE_BIND_ROOM_PRICE_CENTS
        value: "175000"
      - key: GATE_INSTALL_SLOTS
        value: "2"
      - key: GATE_CONTACT_EMAIL
        value: hello@velaru.xyz
      - key: GATE_GA_ID
        sync: false
      - key: GATE_META_PIXEL_ID
        sync: false
      - key: GATE_RECEIPT_PRIVATE_KEY
        sync: false
      - key: GATE_RECEIPT_PUBLIC_KEY
        sync: false
      - key: GATE_X402_PAYTO
        sync: false
      - key: GATE_X402_FACILITATOR_URL
        sync: false
      # CDP facilitator (verify + settle). Defaults to api.cdp.coinbase.com/platform/v2/x402.
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      # Issuing auth mouth. Do not set GATE_ISSUING_ENABLED=1 until Stripe Issuing
      # for agents (own business) is approved — money_real follows that flag.
      - key: GATE_ISSUING_ENABLED
        sync: false
      - key: STRIPE_ISSUING_WEBHOOK_SECRET
        sync: false
      # Fail closed: do not set GATE_X402_ACCEPT_UNVERIFIED outside GATE_DEV_MODE.
