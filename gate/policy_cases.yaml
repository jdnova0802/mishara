      "sink": "bank.rtp",
      "actor": "agent:ops",
      "human_principal_id": "human:demond",
      "policy": {
        "denied_actions": ["wire.send"],
        "allowed_actions": ["wire.send"]
      },
      "expect": "NONEXIST",
      "signal": "action_denied"
    },
    {
      "name": "hold_is_require_approval",
      "action": "wire.send",
      "sink": "bank.rtp",
