services:
  - type: web
    name: mishara
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements_mishara.txt
    startCommand: gunicorn mishara_app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: VELARU_API_URL
        value: https://velaru.onrender.com
      - key: MISHARA_DB_PATH
        value: /tmp/mishara.db
      - key: OPENAI_API_KEY
        sync: false
      - key: MISHARA_SECRET_KEY
        sync: false
