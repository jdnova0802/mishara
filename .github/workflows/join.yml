name: Join pack

on:
  push:
    paths:
      - "join/**"
      - ".github/workflows/join.yml"
  pull_request:
    paths:
      - "join/**"
      - ".github/workflows/join.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Join pack tests
        run: python3 -m join.test_pack
