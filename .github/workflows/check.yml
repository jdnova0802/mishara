name: Check pack

on:
  push:
    paths:
      - "check/**"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "check/**"
      - ".github/workflows/check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail-closed pack tests
        run: python -m check.test_pack
