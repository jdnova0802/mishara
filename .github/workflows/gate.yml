name: Gate institutional checks

on:
  push:
    paths:
      - "gate/**"
      - ".github/workflows/gate.yml"
  pull_request:
    paths:
      - "gate/**"
      - ".github/workflows/gate.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install flask python-dotenv stripe bcrypt requests pytest
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Commerce + institutional surface tests
        env:
          GATE_DEV_MODE: "1"
        run: python -m pytest test_commerce.py test_listings.py -q
      - name: Ban borrowed-cred tokens in stranger templates
        run: |
          ! rg -n "\\bDTCC\\b|\\bSWIFT\\b|\\bFedwire\\b" templates --glob '*.html'
      - name: Ban lab jargon in OpenAPI builder strings
        run: |
          ! rg -n "HAUNTED_CRITICAL|CHOKE|ghost-bind|stick-meter|charge-bride|hop-tattoo|soft-yes-snare" --glob '*.py' .
      - name: Commerce SSOT present
        run: |
          test -f commerce/ladder.json
          test -f commerce/doctrine.json
          test -f commerce/entities.json
          test -f commerce/hosts.json
