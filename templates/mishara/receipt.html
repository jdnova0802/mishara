<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Receipt — Mishara</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#FAFAF8;color:#1A1A2E;max-width:640px;margin:40px auto;padding:20px;text-align:center;}
a{color:#0D7377;}
.btn{display:inline-block;margin-top:20px;padding:14px 24px;background:#0D7377;color:#fff;border-radius:12px;text-decoration:none;font-weight:600;}
</style>
</head>
<body>
<h1>Your Mishara Receipt</h1>
<p>Case ID: <code>{{ receipt_hash[:16] }}…</code></p>
<p>This receipt is independently verifiable through Velaru's public verifier — Mishara does not control the audit chain.</p>
<a class="btn" href="{{ velaru_verify }}?entry_id={{ receipt_hash }}" target="_blank" rel="noopener">Verify on Velaru →</a>
<p style="margin-top:24px;"><a href="/">← Back to Mishara</a></p>
</body>
</html>
